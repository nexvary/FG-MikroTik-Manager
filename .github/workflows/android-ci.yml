name: Android CI

on:
  workflow_dispatch:
    inputs:
      tested_run:
        description: Existing run whose APKs will be verified without rebuilding
        required: true
        default: "37153796474"
      tested_commit:
        description: Exact application source commit for those APKs
        required: true
        default: "8d0423358d403bcb21306d6a294e2af4d7043b60"
  push:
    paths-ignore:
      - 'server/**'
      - 'desktop/**'
      - 'docs/**'
      - '.github/workflows/server-ci.yml'
      - '.github/workflows/windows-desktop-ci.yml'
    branches:
      - main
      - "dev/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[ui-proof-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Portal status tests
        run: node scripts/test-portal-status.cjs

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify and stage final APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FG-MTM-Android-0.17.4.apk
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/FG-MTM-Android-0.17.4.apk | head -n 1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.fgmachines.mikrotikmanager'"
          echo "$BADGING" | grep -F "versionCode='27'"
          echo "$BADGING" | grep -F "versionName='0.17.4'"
          sha256sum dist/FG-MTM-Android-0.17.4.apk | tee dist/FG-MTM-Android-0.17.4.sha256

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.17.4-verification
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.17.4-android-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.17.4-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload final named APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-Android-0.17.4
          path: |
            dist/FG-MTM-Android-0.17.4.apk
            dist/FG-MTM-Android-0.17.4.sha256
          if-no-files-found: error


  ui-proof:
    if: ${{ always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ui-proof-only]')) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Validate reused application sources
        if: needs.build.result == 'skipped'
        env:
          TESTED_COMMIT: ${{ inputs.tested_commit || '8d0423358d403bcb21306d6a294e2af4d7043b60' }}
          TESTED_RUN: ${{ inputs.tested_run || '37153796474' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TESTED_RUN}" --jq .head_sha)
          test "$actual" = "$TESTED_COMMIT"
          git fetch --depth=1 origin "$TESTED_COMMIT"
          git diff --exit-code "$TESTED_COMMIT" HEAD -- app/src app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.result == 'skipped' && 'FG-MTM-0.12.0-debug' || 'FG-MTM-0.17.4-debug' }}
          path: app/build/outputs/apk/debug
          run-id: ${{ inputs.tested_run || (needs.build.result == 'skipped' && '37153796474') || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.result == 'skipped' && 'FG-MTM-0.12.0-android-tests' || 'FG-MTM-0.17.4-android-tests' }}
          path: app/build/outputs/apk/androidTest/debug
          run-id: ${{ inputs.tested_run || (needs.build.result == 'skipped' && '37153796474') || github.run_id }}
          github-token: ${{ github.token }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run compact-phone UI proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run-ui-checks.sh

      - name: Package Android UI proof
        if: always()
        shell: bash
        run: |
          mkdir -p proof-bundles
          if find ui-proof -maxdepth 1 -type f | grep -q .; then
            (cd ui-proof && zip -9 -r ../proof-bundles/Android-UI-Proof.zip .)
          fi

      - name: Upload UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.17.4-ui-proof
          path: |
            ui-proof/*
            proof-bundles/Android-UI-Proof.zip
          if-no-files-found: error
