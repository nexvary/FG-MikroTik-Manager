name: Android CI

on:
  push:
    branches:
      - main
      - "dev/**"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[ui-proof-only]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Portal status tests
        run: node scripts/test-portal-status.cjs

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.12.0-verification
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/lint-results-debug.*

      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.12.0-android-tests
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.12.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  ui-proof:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Download tested APK
        uses: actions/download-artifact@v4
        with:
          name: FG-MTM-0.12.0-debug
          path: app/build/outputs/apk/debug

      - name: Download instrumentation APK
        uses: actions/download-artifact@v4
        with:
          name: FG-MTM-0.12.0-android-tests
          path: app/build/outputs/apk/androidTest/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run compact-phone UI proof
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/run-ui-checks.sh

      - name: Upload UI proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.12.0-ui-proof
          path: ui-proof/*
          if-no-files-found: error
