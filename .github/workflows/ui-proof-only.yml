name: Reuse tested APK for UI proof

on:
  push:
    branches:
      - "dev/**"

permissions:
  contents: read
  actions: read

jobs:
  ui-proof-only:
    if: contains(github.event.head_commit.message, '[share-proof-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify application source matches the tested APK
        run: git diff --exit-code 92dcbd9da960a417eff1142a8727e3c0517d9eb3 HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle
      - uses: android-actions/setup-android@v4
        with:
          packages: ""
      - name: Reuse APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: FG-MTM-0.8.5-debug
          path: app/build/outputs/apk/debug
          run-id: 37012902198
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise actual sharing actions and font-scaled footer with fixture data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/capture-share-proof.sh
      - name: Upload screenshots and runtime log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.8.5-ui-proof
          path: ui-proof/
          if-no-files-found: error
