name: Windows Desktop CI
on:
  push:
    branches: [dev/product-family]
    paths: ['desktop/**', '.github/workflows/windows-desktop-ci.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/windows-desktop-ci.yml']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore desktop/FG.MTM.Desktop/FG.MTM.Desktop.csproj
      - name: Build
        run: dotnet build desktop/FG.MTM.Desktop/FG.MTM.Desktop.csproj --configuration Release --no-restore
