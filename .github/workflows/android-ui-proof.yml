name: Android UI Proof

on:
  push:
    branches:
      - "dev/phase-1-foundation"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run app and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p ui-proof
            adb shell wm size 720x1600
            adb shell wm density 320
            adb install -r app/build/outputs/apk/debug/app-debug.apk

            adb shell am force-stop com.fgmachines.mikrotikmanager
            adb shell am start -n com.fgmachines.mikrotikmanager/.MainActivity --ez ui_demo true --es demo_screen menu
            sleep 3
            adb exec-out screencap -p > ui-proof/01-main-menu.png

            adb shell am force-stop com.fgmachines.mikrotikmanager
            adb shell am start -n com.fgmachines.mikrotikmanager/.MainActivity --ez ui_demo true --es demo_screen winbox
            sleep 3
            adb exec-out screencap -p > ui-proof/02-winbox-manager.png

            adb shell am force-stop com.fgmachines.mikrotikmanager
            adb shell am start -n com.fgmachines.mikrotikmanager/.MainActivity --ez ui_demo true --es demo_screen vouchers
            sleep 3
            adb exec-out screencap -p > ui-proof/03-vouchers.png

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        with:
          name: FG-MTM-0.3.1-ui-proof
          path: ui-proof/*.png
          if-no-files-found: error
