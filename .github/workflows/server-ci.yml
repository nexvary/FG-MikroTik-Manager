name: Optional server checks
on:
  push:
    branches: [dev/product-family]
    paths: ['server/**', '.github/workflows/server-ci.yml']
  workflow_dispatch:
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: fgmtm
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      FG_DATABASE_URL: postgresql://postgres:isolated-ci-only@localhost:5432/fgmtm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r server/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: server
      - run: sudo apt-get update -qq && sudo apt-get install -y freeradius freeradius-rest freeradius-utils
      - run: timeout 90 bash scripts/radius-smoke.sh
        working-directory: server
      - name: Failure diagnostics
        if: failure()
        run: cat /tmp/fg-radius-config.log /tmp/fg-radius.log /tmp/fg-http.log /tmp/fg-accept.log /tmp/fg-reject.log /tmp/fg-accounting.log 2>/dev/null || true
