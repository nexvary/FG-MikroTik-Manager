<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>@@NETWORK@@</title><link rel="stylesheet" href="fg.css"><script src="md5.js"></script></head><body><main>
<button class="lang" type="button" onclick="toggleLanguage()">AR / EN</button><img class="logo" src="@@LOGO@@" alt=""><h1>@@NETWORK@@</h1><p>@@WELCOME@@</p><p data-ar="اتصل بشبكة الواي فاي، ثم أدخل بيانات الكارت." data-en="Connect to Wi-Fi, then enter your voucher.">اتصل بشبكة الواي فاي، ثم أدخل بيانات الكارت.</p>
$(if error)<p class="error" id="error" data-error="$(error-esc)">تعذر تسجيل الدخول. راجع الكود وكلمة المرور أو تواصل مع الدعم.</p>$(endif)
<form id="login" action="$(link-login-only)" method="post" onsubmit="return loginVoucher()" autocomplete="off">
<label for="code" data-ar="كود الكارت / اسم المستخدم" data-en="Voucher code / username">كود الكارت / اسم المستخدم</label><input id="code" name="username" maxlength="128" required autocapitalize="none" spellcheck="false" value="$(username)">
<label class="checkLabel"><input class="check" id="same" type="checkbox" checked onchange="showPassword()"><span data-ar="الكود هو كلمة المرور" data-en="Code and password are the same">الكود هو كلمة المرور</span></label>
<div id="passwordBox" class="hide"><label for="password" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><input id="password" type="password" maxlength="128" autocomplete="off"></div>
<input id="submittedPassword" type="hidden" name="password"><input type="hidden" name="dst" value="$(link-status)"><input type="hidden" name="popup" value="false">
<button type="submit" data-ar="اتصال بالإنترنت" data-en="Connect to internet">اتصال بالإنترنت</button></form>
<p class="error" id="localError"></p><div class="terms">@@TERMS@@</div><footer><span>@@PHONE@@</span><br><a href="@@WEBSITE@@" rel="noreferrer" id="website">Website / Facebook</a><p>FG Machines WiFi</p></footer>
</main><script>
var chapId='$(chap-id)',chapChallenge='$(chap-challenge)',secureLogin='$(ssl-login)',plainAllowed='$(plain-passwd)';
function showPassword(){document.getElementById('passwordBox').classList.toggle('hide',document.getElementById('same').checked)}
function loginVoucher(){var u=document.getElementById('code').value,p=document.getElementById('same').checked?u:document.getElementById('password').value;if(!p){document.getElementById('localError').textContent='أدخل كلمة المرور / Enter password';return false}if(chapId){document.getElementById('submittedPassword').value=hexMD5(chapId+p+chapChallenge)}else if(secureLogin==='yes'||location.protocol==='https:'){document.getElementById('submittedPassword').value=p}else{document.getElementById('localError').textContent='هذا الاتصال لا يدعم CHAP أو HTTPS. اطلب من صاحب الشبكة تفعيل الدخول الآمن. / CHAP or HTTPS is required.';return false}return true}
(function(){var params=new URLSearchParams(location.hash.substring(1));if(location.hash)history.replaceState(null,'',location.pathname+location.search);var code=params.get('u');if(code){document.getElementById('code').value=code;document.getElementById('same').checked=params.get('same')==='1';showPassword();try{sessionStorage.setItem('fgVoucher',JSON.stringify({u:code,profile:params.get('profile')||'',expiry:params.get('expiry')||'',limit:params.get('limit')||''}))}catch(e){}}})();
</script><script src="fg.js"></script></body></html>
