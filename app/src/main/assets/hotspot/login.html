<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>@@NETWORK@@</title><link rel="stylesheet" href="fg.css"><script src="md5.js"></script></head><body class="login-page"><main class="login-card">
<header class="portal-header"><span class="brand-name">FG <span>Machines</span></span><button class="lang" type="button" onclick="toggleLanguage()" aria-label="العربية / English">AR / EN</button></header>
<div class="brand-emblem" aria-hidden="true"><span>FG</span><svg viewBox="0 0 48 30" fill="none"><path d="M5 9c11-10 27-10 38 0M12 17c7-6 17-6 24 0M19 24c3-3 7-3 10 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
<img class="logo" src="@@LOGO@@" alt="">
<div class="portal-intro"><span class="eyebrow" data-ar="بوابتك إلى الإنترنت" data-en="Your gateway to the internet">بوابتك إلى الإنترنت</span><h1>@@NETWORK@@</h1><p class="welcome">@@WELCOME@@</p></div>
<div class="login-guide"><span class="step">1</span><span data-ar="أدخل كود الكارت" data-en="Enter your voucher code">أدخل كود الكارت</span><span class="guide-line"></span><span class="step">2</span><span data-ar="ابدأ الاتصال" data-en="Connect and enjoy">ابدأ الاتصال</span></div>
$(if error)<p class="error" role="alert" id="error" data-error="$(error-esc)">تعذر تسجيل الدخول. راجع الكود وكلمة المرور أو تواصل مع الدعم.</p>$(endif)
<form id="login" action="$(link-login-only)" method="post" onsubmit="return loginVoucher()" autocomplete="off">
<label for="code" data-ar="كود الكارت / اسم المستخدم" data-en="Voucher code / username">كود الكارت / اسم المستخدم</label><div class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h5"/></svg><input id="code" aria-describedby="codeHint" placeholder="مثال: 12345678" data-placeholder-ar="مثال: 12345678" data-placeholder-en="Example: 12345678" name="username" maxlength="128" required autocapitalize="none" spellcheck="false" value="$(username)"></div><small id="codeHint" class="field-hint" data-ar="اكتب الكود كما هو مطبوع على الكارت." data-en="Use the code printed on your voucher.">اكتب الكود كما هو مطبوع على الكارت.</small>
<label class="checkLabel"><input class="check" id="same" type="checkbox" checked onchange="showPassword()"><span data-ar="الكود هو كلمة المرور" data-en="Code and password are the same">الكود هو كلمة المرور</span></label>
<div id="passwordBox" class="hide"><label for="password" data-ar="كلمة المرور" data-en="Password">كلمة المرور</label><input id="password" type="password" maxlength="128" autocomplete="off"></div>
<input id="submittedPassword" type="hidden" name="password"><input type="hidden" name="dst" value="$(link-status)"><input type="hidden" name="popup" value="false">
<button class="connect-button" type="submit"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v8M6.3 5.8a8 8 0 1 0 11.4 0"/></svg><span data-ar="اتصال بالإنترنت" data-en="Connect to internet">اتصال بالإنترنت</span></button></form>
<p class="error" id="localError" role="alert" aria-live="polite"></p><div class="terms">@@TERMS@@</div><footer><span class="support-label" data-ar="للمساعدة والتواصل" data-en="Help & support">للمساعدة والتواصل</span><span class="support-phone">@@PHONE@@</span><a href="@@WEBSITE@@" rel="noreferrer" id="website">Website / Facebook</a><p class="powered">Powered by <strong>FG Machines</strong></p></footer>
</main><script>
var chapId='$(chap-id)',chapChallenge='$(chap-challenge)',secureLogin='$(ssl-login)',plainAllowed='$(plain-passwd)';
function showPassword(){var same=document.getElementById('same').checked;document.getElementById('passwordBox').classList.toggle('hide',same);document.getElementById('password').required=!same;document.getElementById('localError').textContent=''}
function loginVoucher(){var u=document.getElementById('code').value,p=document.getElementById('same').checked?u:document.getElementById('password').value;if(!p){document.getElementById('localError').textContent='أدخل كلمة المرور / Enter password';return false}if(chapId){document.getElementById('submittedPassword').value=hexMD5(chapId+p+chapChallenge)}else if(secureLogin==='yes'||location.protocol==='https:'){document.getElementById('submittedPassword').value=p}else{document.getElementById('localError').textContent='هذا الاتصال لا يدعم CHAP أو HTTPS. اطلب من صاحب الشبكة تفعيل الدخول الآمن. / CHAP or HTTPS is required.';return false}return true}
(function(){var params=new URLSearchParams(location.hash.substring(1));if(location.hash)history.replaceState(null,'',location.pathname+location.search);var code=params.get('u');if(code){document.getElementById('code').value=code;document.getElementById('same').checked=params.get('same')==='1';showPassword();try{sessionStorage.setItem('fgVoucher',JSON.stringify({u:code,profile:params.get('profile')||'',expiry:params.get('expiry')||'',limit:params.get('limit')||''}))}catch(e){}}})();
</script><script src="fg.js"></script></body></html>
